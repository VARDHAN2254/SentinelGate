global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape SentinelGate backend Actuator metrics
  - job_name: 'sentinelgate-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      # Inside Docker Compose: use the service name
      # When running locally: change to 'localhost:8080'
      - targets: ['sentinelgate-backend:8080']
